<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: #16213e;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #0f3460;
  }
  #header h1 { font-size: 18px; color: #e94560; }
  #online {
    font-size: 13px;
    color: #888;
  }
  #online .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ecca3;
    margin-right: 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    word-break: break-word;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.mine {
    align-self: flex-end;
    background: #0f3460;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.other {
    align-self: flex-start;
    background: #16213e;
    color: #ccc;
    border-bottom-left-radius: 4px;
  }
  .msg .author {
    font-size: 11px;
    color: #e94560;
    margin-bottom: 2px;
    font-weight: 600;
  }
  .msg .time {
    font-size: 10px;
    color: #555;
    margin-top: 3px;
    text-align: right;
  }
  .msg.mine .time { text-align: right; }
  #form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #16213e;
    border-top: 1px solid #0f3460;
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    background: #1a1a2e;
    color: #eee;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: #e94560; }
  #send {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: #e94560;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #send:hover { background: #c73a52; }
  #send:disabled { opacity: 0.4; cursor: default; }
  #nameModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #nameModal .box {
    background: #16213e;
    padding: 32px;
    border-radius: 16px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    border: 1px solid #0f3460;
  }
  #nameModal h2 { color: #e94560; margin-bottom: 16px; }
  #nameModal input {
    width: 100%;
    padding: 12px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    background: #1a1a2e;
    color: #eee;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  #nameModal input:focus { border-color: #e94560; }
  #nameModal button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #e94560;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  #nameModal button:hover { background: #c73a52; }
  .system {
    text-align: center;
    font-size: 12px;
    color: #555;
    margin: 4px 0;
  }
  #charCount { font-size: 11px; color: #555; margin-right: 8px; align-self: center; }
</style>
</head>
<body>

<div id="nameModal">
  <div class="box">
    <h2>Вход в чат</h2>
    <p style="color:#888;font-size:14px;margin-bottom:16px;">Введите имя, под которым вас увидят другие</p>
    <input id="nameInput" placeholder="Ваше имя..." maxlength="20" autofocus>
    <button id="nameBtn">Войти</button>
  </div>
</div>

<div id="header">
  <h1>💬 Чат</h1>
  <div id="online"><span class="dot"></span> Gun.js P2P</div>
</div>

<div id="messages"></div>

<div id="form">
  <span id="charCount">0/500</span>
  <input id="input" placeholder="Напишите сообщение..." maxlength="500" disabled>
  <button id="send" disabled>Отправить</button>
</div>

<script>
// ====== НАСТРОЙКА GUN ======
// Используем несколько публичных relay-серверов для надёжности
const gun = Gun([
  "https://gun-manhattan.herokuapp.com/gun",
  "https://peer.wallie.io/gun",
  "https://gun-relay.glitch.me/gun"
]);

// Уникальный ключ комнаты — поменяйте, чтобы сделать приватный чат
const ROOM = "global-chat-room-2026";

let userName = "";
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const charCount = document.getElementById("charCount");
const nameModal = document.getElementById("nameModal");
const nameInput = document.getElementById("nameInput");
const nameBtn = document.getElementById("nameBtn");

// Защита от XSS
function esc(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// Сохранение имени
const saved = sessionStorage.getItem("chatName");
if (saved) { userName = saved; enterChat(); }

nameBtn.addEventListener("click", () => {
  const val = nameInput.value.trim();
  if (!val) { nameInput.style.borderColor = "#e94560"; return; }
  userName = val;
  sessionStorage.setItem("chatName", val);
  enterChat();
});

nameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") nameBtn.click();
});

function enterChat() {
  nameModal.style.display = "none";
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();

  const sys = document.createElement("div");
  sys.className = "system";
  sys.textContent = "Вы вошли как " + userName;
  messagesEl.appendChild(sys);
}

// Отправка сообщения
function send() {
  const text = inputEl.value.trim();
  if (!text || !userName) return;
  const now = Date.now();
  gun.get(ROOM).get(now).put({
    name: userName,
    text: text,
    time: now
  });
  inputEl.value = "";
  charCount.textContent = "0/500";
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
inputEl.addEventListener("input", () => {
  charCount.textContent = inputEl.value.length + "/500";
});

// Получение сообщений
const seen = new Set();
gun.get(ROOM).map().on((data, key) => {
  if (!data || seen.has(key)) return;
  seen.add(key);
  appendMsg(data.name, data.text, data.time);
});

function appendMsg(name, text, time) {
  const div = document.createElement("div");
  div.className = "msg " + (name === userName ? "mine" : "other");

  const author = document.createElement("div");
  author.className = "author";
  author.textContent = esc(name);

  const body = document.createElement("div");
  body.innerHTML = esc(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#4ecca3">$1</a>');

  const t = document.createElement("div");
  t.className = "time";
  const d = new Date(time);
  t.textContent = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  div.appendChild(author);
  div.appendChild(body);
  div.appendChild(t);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>
</body>
</html>
