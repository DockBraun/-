<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Чат на Gun.js (GitHub Pages + WebRTC)</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
      #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #fff; margin-bottom: 10px; }
      #chat-box div { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; }
      #chat-box .me { background: #e3f2fd; text-align: right; }
      #chat-box .other { background: #fff; text-align: left; }
      #input-area { display: flex; gap: 10px; }
      #input-area input { flex: 1; padding: 10px; }
      #input-area button { padding: 10px 20px; }
      #status { margin-top: 10px; font-size: 0.9em; color: #666; }
    </style>
  </head>
  <body>
    <h2>Чат (Gun.js + WebRTC)</h2>
    <div id="chat-box"></div>
    <div id="input-area">
      <input id="message-input" type="text" placeholder="Введите сообщение..." />
      <button id="send-btn">Отправить</button>
    </div>
    <div id="status">Статус: ожидание подключения...</div>

    <!-- Подключаем Gun.js и WebRTC-плагин -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/lib/webrtc.js"></script>

    <script>
      // Инициализируем Gun с WebRTC и без внешних релеев
      var gun = Gun({
        peers: , // Пустой массив: не используем внешние релеи
        relays:  // Пустой массив: не используем внешние релеи
      });

      // Включаем WebRTC
      gun.opt({
        reliable: true,
        retry: 3,
        timeout: 5000
      });

      // Ссылка на чат в базе Gun
      var chat = gun.get('chat-room-1');

      // Отображение сообщений
      var chatBox = document.getElementById('chat-box');
      var input = document.getElementById('message-input');
      var sendBtn = document.getElementById('send-btn');
      var statusEl = document.getElementById('status');

      // Функция добавления сообщения в DOM
      function addMessage(text, isMe) {
        var div = document.createElement('div');
        div.textContent = text;
        div.className = isMe ? 'me' : 'other';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // Слушаем новые сообщения
      chat.map().on(function (data, key) {
        if (data && data.text) {
          addMessage(data.text, false);
          statusEl.textContent = 'Статус: подключено, получены новые сообщения';
        }
      });

      // Отправка сообщения
      function sendMessage() {
        var text = input.value.trim();
        if (!text) return;

        // Генерируем уникальный ключ (время + случайное число)
        var id = new Date().getTime() + '-' + Math.random().toString(36).substr(2, 5);

        // Записываем сообщение в Gun
        chat.set(id).put({
          text: text,
          time: new Date().toISOString(),
          user: 'user-' + Math.floor(Math.random() * 1000) // Простой идентификатор пользователя
        });

        addMessage(text, true);
        input.value = '';
        statusEl.textContent = 'Статус: сообщение отправлено';
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
      });

      // Проверка подключения
      gun.on('out', function (event) {
        if (event.reason === 'no peers') {
          statusEl.textContent = 'Статус: нет пиров (WebRTC не смог соединиться)';
        } else {
          statusEl.textContent = 'Статус: ошибка соединения';
        }
      });

      gun.on('in', function () {
        statusEl.textContent = 'Статус: соединение установлено';
      });
    </script>
  </body>
</html>
