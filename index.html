<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Чат Gun.js</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    .msg { margin: 5px 0; padding: 5px; border-radius: 4px; }
    .me { background: #dcf8c6; text-align: right; }
    .other { background: #fff; text-align: left; }
    input[type="text"] { width: 70%; padding: 8px; }
    button { padding: 8px 15px; }
    #status { margin-top: 10px; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
  <h2>Чат (GitHub Pages)</h2>
  <div id="messages"></div>
  <div style="display: flex; gap: 10px;">
    <input type="text" id="input" placeholder="Сообщение..." />
    <button id="send">Отправить</button>
  </div>
  <div id="status">Ожидание подключения...</div>

  <!-- Подключаем Gun.js -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script>
    // Инициализация Gun БЕЗ внешних релеев (пустой массив peers)
    // Это критически важно: мы не хотим стучаться в старые, неработающие сервера
    var gun = Gun({
      peers: , 
      relays: 
    });

    // Ссылка на чат
    var chat = gun.get('my-simple-chat-room');

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusDiv = document.getElementById('status');

    // Функция отображения сообщений
    function renderMessage(text, isMe) {
      const div = document.createElement('div');
      div.className = isMe ? 'me' : 'other';
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Слушаем изменения в чате
    // .map() нужен, чтобы получать список сообщений, а не только последнее состояние
    chat.map().on(function(data, id) {
      if (data && data.text) {
        renderMessage(data.text, false); // false = сообщение от другого
        statusDiv.textContent = 'Статус: сообщения получены';
      }
    });

    // Отправка сообщения
    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Генерируем уникальный ID для сообщения
      const msgId = new Date().getTime() + '-' + Math.random().toString(36).substr(2, 5);
      
      // Записываем в Gun
      chat.set(msgId).put({
        text: text,
        time: new Date().toLocaleTimeString()
      });

      renderMessage(text, true); // true = моё сообщение
      input.value = '';
      statusDiv.textContent = 'Статус: отправлено локально';
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Проверка состояния соединения
    gun.on('out', function(event) {
      if (event.reason === 'no peers') {
        statusDiv.textContent = 'Статус: нет пиров (WebRTC не соединился)';
      }
    });
    
    gun.on('in', function() {
      statusDiv.textContent = 'Статус: соединение активно';
    });
  </script>
</body>
</html>
